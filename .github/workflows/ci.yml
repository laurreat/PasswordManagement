name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: localpass-windows-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
